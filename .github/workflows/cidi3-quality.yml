name: CI + Quality Gates

on:
  push:
    branchess: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout (v4)
      # SHA from actions/checkout repo
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # -----------------------------
      # Setup Python (v5)
      # SHA from actions/setup-python repo
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          pip install --only-binary :all: --upgrade pip
          pip install --only-binary :all: --require-hashes -r requirements.txt

      # -----------------------------
      # Linting
      # -----------------------------
      - name: Run linting
        run: flake8 .

      # -----------------------------
      # Tests + Coverage
      # -----------------------------
      - name: Run tests with coverage
        run: |
          rm -f .coverage
          coverage run -m pytest
          coverage xml -i

      # -----------------------------
      # Normalize coverage paths
      # -----------------------------
      - name: Normalize coverage paths
        run: |
          sed -i 's|C:\\\\Users\\\\Dell\\\\Desktop\\\\cidiSoftDev\\\\tests|./tests|g' coverage.xml
          sed -i 's|[A-Za-z]:\\\

\[^"]*|./|g' coverage.xml

      # -----------------------------
      # Upload coverage report (v5)
      # SHA from actions/upload-artifact repo
      # -----------------------------
      - name: Upload coverage report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: coverage-report
          path: coverage.xml

      # -----------------------------
      # Setup Java (v6)
      # SHA from actions/setup-java repo
      # -----------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '21'
          distribution: 'temurin'

      # -----------------------------
      # SonarCloud Scan (v3)
      # SHA from sonarsource/sonarcloud-github-action repo
      # -----------------------------
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@eb211723266fe8e83102bac7361f0a05c3ac1d1b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
