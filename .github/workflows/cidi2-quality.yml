name: CI + Quality Gates

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@b4ffde3a9a0a7b3c9e0f5c2f5d3d3e6f0f0f0f0f  # v4 SHA
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@82c7e6c0b8e6e3b2f4c7d8a9e1f2c3d4e5f6a7b  # v5 SHA
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all -r requirements.txt
          pip install --only-binary :all pytest coverage flake8

      - name: Run linting
        run: flake8 .

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@b3f5c2d4e6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1  # v4 SHA
        with:
          name: coverage-report
          path: coverage.xml

      - name: Set up JDK 21
        uses: actions/setup-java@c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2  # v5 SHA
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@b16d2601a6b948e2fb26f3772276581f31daa7cd  # v3 SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}