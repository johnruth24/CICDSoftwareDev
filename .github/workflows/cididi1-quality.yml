name: CI + Quality Gates

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python --only-binary :all: -m pip install --upgrade pip
          pip install --only-binary :all: --require-hashes -r requirements.txt

      - name: Run linting
        run: flake8 .

      - name: Run tests with coverage
        run: |
          rm -f .coverage
          coverage run -m pytest
          coverage xml -i

      - name: Normalize coverage paths
        run: |
          sed -i 's|C:\\\\Users\\\\Dell\\\\Desktop\\\\cidiSoftDev\\\\tests|./tests|g' coverage.xml
          sed -i 's|[A-Za-z]:\\\\[^"]*|./|g' coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}